<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Apply the saved/preferred theme before paint to avoid a flash. -->
  <script>
    (function () {
      try {
        // Dark is the default; only an explicit saved choice switches to light.
        if (localStorage.getItem('waga-theme') === 'light')
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <title>waga - WhatsApp Gateway for backends &amp; AI agents</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Self-hosted, open-source WhatsApp gateway. Clean REST API and signed webhooks for your backend, plus an MCP server for AI agents.">
  <meta name="keywords" content="WhatsApp, WhatsApp API, Go, Golang, gateway, open source, messaging, integration, waga, MCP, AI agents">
  <meta name="author" content="Glenn Prays">
  <link rel="canonical" href="https://waga.glennprays.com/">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ .BasePath }}/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ .BasePath }}/assets/favicon-16x16.png">
  <link rel="shortcut icon" href="{{ .BasePath }}/assets/favicon.ico">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://waga.glennprays.com/">
  <meta property="og:title" content="waga - Self-hosted WhatsApp Gateway">
  <meta property="og:description" content="Self-hosted, open-source WhatsApp gateway. Clean REST API and signed webhooks for your backend, plus an MCP server for AI agents.">
  <meta property="og:image" content="https://waga.glennprays.com/assets/og-image.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://waga.glennprays.com/">
  <meta name="twitter:title" content="waga - Self-hosted WhatsApp Gateway">
  <meta name="twitter:description" content="Self-hosted, open-source WhatsApp gateway. Clean REST API and signed webhooks for your backend, plus an MCP server for AI agents.">
  <meta name="twitter:image" content="https://waga.glennprays.com/assets/og-image.png">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareSourceCode",
    "name": "waga",
    "alternateName": "WhatsApp Gateway",
    "description": "Open-source WhatsApp Gateway written in Go. REST API gateway that abstracts WhatsApp Web complexity.",
    "author": {
      "@type": "Person",
      "name": "Glenn Prays"
    },
    "programmingLanguage": "Go",
    "license": "https://opensource.org/licenses/MIT",
    "codeRepository": "https://github.com/glennprays/whatsapp-gateway",
    "url": "https://waga.glennprays.com/"
  }
  </script>

  <!-- External CSS -->
    <link rel="stylesheet" href="{{ .BasePath }}/assets/styles.css">
  {{ if .ShowAPI }}
  <!-- RapiDoc Web Component -->
  <script
    type="module"
    src="{{ .BasePath }}/assets/rapidoc-min.js">
  </script>
  {{ end }}
  <!-- Marked.js for Markdown rendering -->
  <script src="{{ .BasePath }}/assets/marked.min.js"></script>
  
  <!-- Load fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Next.js style header -->
  <div class="header">
    <div class="header-content">
      <div class="header-left">
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <a href="#" class="logo" id="logo-link">
          <!-- <div class="logo-icon"></div> -->
            <span class="logo-text">waga</span>
        </a>
        {{ if .Version }}<span class="version-badge" title="Running server version">{{ .Version }}</span>{{ end }}
        <div class="nav-tabs">
          <button class="nav-tab active" data-view="docs">Docs</button>
          {{ if .ShowAPI }}<button class="nav-tab" data-view="api">API</button>{{ end }}
        </div>
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
        <a href="https://github.com/glennprays/whatsapp-gateway" class="github-link" target="_blank">GitHub →</a>
      </div>
    </div>
  </div>

  <div class="content-container">
    <!-- Documentation View (Next.js style) -->
    <div id="docs-view" class="content-view active">
      <div class="docs-layout">
        <!-- Sidebar Navigation - Will be generated dynamically -->
        <nav class="docs-sidebar" id="sidebar">
          <!-- Sidebar will be populated by JavaScript -->
        </nav>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Content -->
        <main class="docs-content">
          <div class="docs-inner">
            <article class="markdown-content" id="markdown-content">
              <div class="loading-spinner">
                <div class="spinner"></div>
              </div>
            </article>
            <aside class="docs-toc" id="docs-toc" aria-label="On this page"></aside>
          </div>
        </main>
      </div>
    </div>
    {{ if .ShowAPI }}
    <!-- API Reference View (RapiDoc) -->
    <div id="api-view" class="content-view">
      <rapi-doc
        id="rapi-doc-element"
        render-style="focused"
        layout="row"
        schema-style="table"
        schema-expand-level="1"
        show-method-in-nav-bar="as-colored-block"
        use-path-in-nav-bar="true"
        allow-try="true"
        allow-server-selection="true"
        allow-authentication="true"
        show-header="false"
        show-info="true"
        theme="dark"
        bg-color="#07090a"
        text-color="#e8ecea"
        primary-color="#25D366"
        nav-bg-color="#07090a"
        nav-text-color="#e8ecea"
        nav-hover-bg-color="#0d1012"
        nav-accent-color="#25D366"
        font-size="default"
        response-area-height="400px"
        style="width: 100%; height: calc(100vh - 64px);"
      >
      </rapi-doc>
    </div>
    {{ end }}
  </div>

  <!-- External JavaScript -->
    <script src="{{ .BasePath }}/assets/app.js"></script>
    <script src="{{ .BasePath }}/assets/search.js"></script>
</body>
</html>
