  /message/incoming:
    get:
      tags:
        - Whatsapp Message
      summary: Fetch recent incoming messages
      description: >
        Returns the most recent incoming WhatsApp messages buffered in memory
        by the gateway for the authenticated session, newest first. Intended
        for OTP retrieval and short-window inbox reads.

        The buffer keeps the last 100 incoming messages per session and is
        lost on gateway restart. Messages sent by the authenticated user are
        excluded. Media URLs are not populated by this endpoint — subscribe
        to webhooks if you need fetchable links.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of messages to return. Clamped server-side to [1, 50].
      responses:
        '200':
          description: Messages returned successfully (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingMessagesResponse'
        '409':
          description: WhatsApp session is not logged in.
      security:
        - accountBearerAuth: []

  /admin/sessions:
    get:
      tags:
        - Admin
      x-root-path: true
      summary: List session inventory (operator-only)
      description: >
        Per-instance inventory of every account this node knows about, merged
        from the in-memory client set, the device store, and persisted lifecycle
        status into honest states (connected / disconnected / never_paired /
        logged_out / banned). Served at the ROOT path (NOT under /api/v1).
        Bearer-gated by ADMIN_API_SECRET; when the secret is unset the route is
        not registered and returns 404 (dark by default). Cross-tenant by design
        (operator visibility); phone numbers are masked. The view is
        per-instance — a device with no live client here may be live on another
        node.
      security:
        - adminBearer: []
      responses:
        '200':
          description: Session inventory (empty node -> count 0, never an error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInventory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Admin plane disabled (ADMIN_API_SECRET unset) or route absent.
  /admin/sessions/{phone}:
    get:
      tags:
        - Admin
      x-root-path: true
      summary: Get one account's session state (operator-only)
      description: >
        Single-account view by bare phone number (no normalization). Served at
        the ROOT path; bearer-gated by ADMIN_API_SECRET (404 when unset).
      security:
        - adminBearer: []
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
          example: "6281910481554"
      responses:
        '200':
          description: The account's merged session state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    type: string
                  session:
                    $ref: '#/components/schemas/SessionInventoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such account on this instance (or admin plane disabled).
  /metrics:
    get:
      tags:
        - Metrics
      x-root-path: true
      summary: Prometheus metrics (operator-only)
      description: >
        Hand-rolled Prometheus text exposition. Served at the ROOT path; gated by
        METRICS_ENABLED (default false) AND the admin bearer (unreachable without
        ADMIN_API_SECRET). Series: `whatsapp_gateway_messages_total{type,mode,result}`,
        `whatsapp_gateway_webhook_deliveries_total{result,mode,event}`, and
        `whatsapp_gateway_sessions{state}` (gauge). Never labelled by phone number.
      security:
        - adminBearer: []
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Metrics disabled (METRICS_ENABLED false) or admin plane unset.
