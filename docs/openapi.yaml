openapi: 3.1.0
info:
  title: Whatsapp Gateway API
  version: 1.0.0
  description: >
    API documentation for Whatsapp Gateway.

    This service allows integration with WhatsApp through REST endpoints.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  x-docs-url: https://github.com/glennprays/whatsapp-gateway/wiki
  x-repository:
    type: git
    url: https://github.com/glennprays/whatsapp-gateway
servers:
  - url: /api/v1
tags:
  - name: Health
    description: Endpoints for checking the health of the service.
  - name: Authentication
    description: Endpoints for user authentication and registration.
  - name: Whatsapp Authentication
    description: Endpoints for WhatsApp authentication.
  - name: Whatsapp Webhook
    description: Endpoints for handling WhatsApp webhooks and events.
  - name: Whatsapp Message
    description: Endpoints for managing WhatsApp chats and messages.

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A description of the error that occurred.
          example: "Invalid request syntax or parameters."
        code:
          type: integer
          description: An error code representing the type of error.
          example: 400
    RegisterRequest:
      type: object
      properties:
        phone_number:
          type: string
          description: The phone number of the user to authenticate.
          example: "6281234567890" 
        secret_key:
          type: string
          description: The secret key for authentication.
          example: "my_secret_key"
    RegisterResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token for the authenticated user.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    LoginQrResponse:
      type: object
      properties:
        qr_code:
          type: string
          description: Base64 encoded QR code for WhatsApp login.
          example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
        expires_in:
          type: integer
          description: Time in seconds until the QR code expires.
          example: 300
    LoginPairResponse:
      type: object
      properties:
        pair_code:
          type: string
          description: Pair code for WhatsApp login.
          example: "123456"
        expires_in:
          type: integer
          description: Time in seconds until the pair code expires.
          example: 300
    WebhookRegisterRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to register for receiving WhatsApp webhooks.
          example: "https://example.com/webhook"
        hmac_secret:
          type: string
          description: Optional secret for validating webhook requests.
          example: "my_webhook_secret"
    SendMessageTextRequest:
      type: object
      properties:
        msisdn::
          type: string 
        description: The recipient's Personal ID or Group ID.
        example: "6281234567890@us.c"
        message:
          type: string
          description: The text message to send.
          example: "Hello, this is a test message."
    SendMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the message was sent successfully.
          example: true
        message_id:
          type: string
          description: The ID of the sent message.
          example: "msg_1234567890"
    SendMessageImageRequest:
      type: multipart/form-data
      properties:
        msisdn:
          type: string
          description: The recipient's Personal ID or Group ID.
          example: "6281234567890@us.c"
        image:
          type: string
          format: binary
          description: The image file to send.
        caption:
          type: string
          description: Optional caption for the image.
          example: "Check out this image!"
        is_view_once:
          type: boolean
          description: Whether the image should be sent as view once.
          example: false
      required:
        - msisdn
        - image
    MessageDeleteRequest:
      type: object
      properties:
        message_id:
          type: string
          description: The ID of the message to delete.
          example: "msg_1234567890"
        msisdn:
          type: string
          description: The recipient's Personal ID or Group ID.
          example: "6281234567890@us.c"
    MessageEditRequest:
      type: object
      properties:
        message_id:
          type: string
          description: The ID of the message to edit.
          example: "msg_1234567890"
        msisdn:
          type: string
          description: The recipient's Personal ID or Group ID.
          example: "6281234567890@us.c"
        new_message:
          type: string
          description: The new text for the message.
          example: "This is the edited message."
    MessageReactRequest:
      type: object
      properties:
        message_id:
          type: string
          description: The ID of the message to react to.
          example: "msg_1234567890"
        msisdn:
          type: string
          description: The recipient's Personal ID or Group ID.
          example: "6281234567890@us.c"
        emoji:
          type: string
          description: The reaction to add (e.g., "👍", "❤️").
          example: "👍"
    OutgoingEventMessage:
      type: string 
      enum:
        - message.queued 
        - message.sent 
        - message.failed 
    OutgoingWebhookPayload:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/OutgoingEventMessage'
        job_id:
          type: string
          description: The ID of the message job.
          example: "job_1234567890" 
        to:
          type: string
          description: The recipient's Personal ID or Group ID.
          example: "6281234567890@s.whatsapp.net"
        phone_number:
          type: string
          description: The sender's phone number.
          example: "6281234567890"
        timestamp:
          type: integer
          description: The timestamp of the event in Unix epoch format.
          example: 1625247600
        message_id:
          type: string
          description: The ID of the whatsapp message.
          example: "msg_1234567890" 
        metadata:
          type: object
          description: Additional metadata related to the event.
          example: {}
    IncomingEventMessage:
      type: string 
      enum:
        - message.incoming
    IncomingMessageType:
      type: string 
      enum:
        - text
        - image
        - video
        - audio
        - document
    IncomingMessageMediaInfo:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/IncomingMessageType'
        url:
          type: string
          description: The URL to access the media content. When WEBHOOK_MEDIA_DOWNLOAD_ENABLED=true, this is a presigned S3 URL (24h expiry) or public local URL. When false, this is the original WhatsApp URL.
          example: "https://example.com/media/msg_0987654321"
        mime_type:
          type: string
          description: The MIME type of the media content.
          example: "image/jpeg"
        filename:
          type: string
          description: The original filename of the media content.
          example: "photo.jpg"
        caption:
          type: string
          description: The caption associated with the media, if any.
          example: "Check out this photo!"
        size:
          type: integer
          description: The size of the media content in bytes.
          example: 204800

    IncomingWebhookPayload:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/IncomingEventMessage'
        chat:
          type: string
          description: The chat ID where the message was received.
          example: "6281234567890@s.whatsapp.net"
        from:
          type: string
          description: The sender's Personal ID or Group ID.
          example: "6281234567890:87@s.whatsapp.net"
        is_group:
          type: boolean
          description: Indicates if the message is from a group.
          example: false
        message_id:
          type: string
          description: The ID of the received message.
          example: "msg_0987654321"
        push_name:
          type: string
          description: The display name of the sender.
          example: "John Doe"
        timestamp:
          type: integer
          description: The timestamp of the message in Unix epoch format.
          example: 1625247600
        text:
          type: string
          description: The text content of the message.
          example: "Hello, this is a test message."
        type:
          $ref: '#/components/schemas/IncomingMessageType'
        media:
          $ref: '#/components/schemas/IncomingMessageMediaInfo'

    IncomingMessage:
      type: object
      description: A single buffered incoming message. Same vocabulary as IncomingWebhookPayload minus the event envelope. Media URLs are not populated here — see webhooks for fetchable links.
      properties:
        message_id:
          type: string
          example: "msg_0987654321"
        chat:
          type: string
          example: "6281234567890@s.whatsapp.net"
        from:
          type: string
          example: "6281234567890:87@s.whatsapp.net"
        is_group:
          type: boolean
          example: false
        push_name:
          type: string
          example: "Google"
        timestamp:
          type: integer
          example: 1625247600
        type:
          $ref: '#/components/schemas/IncomingMessageType'
        text:
          type: string
          example: "Your verification code is 123456"
        media:
          $ref: '#/components/schemas/IncomingMessageMediaInfo'

    IncomingMessagesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: integer
          description: Unix milliseconds when the response was generated.
          example: 1715900000000
        count:
          type: integer
          example: 2
        messages:
          type: array
          items:
            $ref: '#/components/schemas/IncomingMessage'
  securitySchemes:
    accountBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses: 
    BadRequest:
      description: Invalid request syntax or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication credentials missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user does not have permission to perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
       description: Conflict with the current state of the resource (e.g., email already exists).
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Returns the health status of the service.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new account
      description: >
        Registers a new user with the provided phone number and secret key to get JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
  /login/qr_code/{format}:
    post:
      tags:
        - Whatsapp Authentication
      summary: Get WhatsApp login QR code
      description: >
        Generates a QR code for WhatsApp login. The QR code is valid for a limited time.
      parameters:
        - name: format
          in: path
          required: true
          description: The format of the QR code, either 'json' or 'html'.
          schema:
            type: string
            enum: [json, html]
      responses:
        '200':
          description: QR code generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginQrResponse'
            text/html:
              schema:
                type: string
                example: "<img src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...'/>"
      security:
        - accountBearerAuth: []
  /login/pair_code:
    post:
      tags:
        - Whatsapp Authentication
      summary: Get WhatsApp login pair code
      description: >
        Generates a pair code for WhatsApp login. The pair code is valid for a limited time.
      responses:
        '200':
          description: Pair code generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPairResponse'
      security:
        - accountBearerAuth: []
  /login/status:
    get:
      tags:
        - Whatsapp Authentication
      summary: Get WhatsApp session status
      description: >
        Retrieves the current WhatsApp session status, including whether the user is logged in.
      responses:
        '200':
          description: Session status retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    description: Indicates if the user is authenticated with WhatsApp.
                    example: true
      security:
        - accountBearerAuth: []
  /session/reconnect:
    post:
      tags:
        - Whatsapp Authentication
      summary: Reconnect to WhatsApp session
      description: >
        Attempts to reconnect to the existing WhatsApp session.
      responses:
        '200':
          description: Reconnection attempt initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /logout:
    post:
      tags:
        - Whatsapp Authentication
      summary: Logout from WhatsApp session
      description: >
        Logs out the user from the current WhatsApp session.
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /webhook:
    get:
      tags:
        - Whatsapp Webhook
      summary: Get registered webhook URL
      description: >
        Retrieves the currently registered webhook URL for receiving WhatsApp events.
      responses:
        '200':
          description: Webhook URL retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: The registered webhook URL.
                    example: "https://example.com/webhook"
      security:
        - accountBearerAuth: []
    post:
      tags:
        - Whatsapp Webhook
      summary: Register a webhook URL
      description: >
        Registers a URL to receive WhatsApp webhook events. Optionally, a secret can be provided for validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRegisterRequest'
      responses:
        '200':
          description: Webhook URL registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
    delete:
      tags:
        - Whatsapp Webhook
      summary: Unregister the webhook URL
      description: >
        Unregisters the currently registered webhook URL.
      responses:
        '200':
          description: Webhook URL unregistered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /message/text:
    post:
      tags:
        - Whatsapp Message
      summary: Send a text message
      description: >
        Sends a text message to a specified recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageTextRequest'
      responses:
        '200':
          description: Message sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
      security:
        - accountBearerAuth: []
  /message/image:
    post:
      tags:
        - Whatsapp Message
      summary: Send an image message
      description: >
        Sends an image message to a specified recipient. The image can be sent as view once.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageImageRequest'
      responses:
        '200':
          description: Image message sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
      security:
        - accountBearerAuth: []
  /message/react:
    post:
      tags:
        - Whatsapp Message
      summary: React to a message
      description: >
        Adds a reaction to a previously sent message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageReactRequest'
      responses:
        '200':
          description: Reaction added successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /message:
    delete:
      tags:
        - Whatsapp Message
      summary: Delete a message
      description: >
        Deletes a previously sent message by its ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDeleteRequest'
      responses:
        '200':
          description: Message deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
    put:
      tags:
        - Whatsapp Message
      summary: Edit a message
      description: >
        Edits a previously sent text message or image caption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageEditRequest'
      responses:
        '200':
          description: Message edited successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /message/incoming:
    get:
      tags:
        - Whatsapp Message
      summary: Fetch recent incoming messages
      description: >
        Returns the most recent incoming WhatsApp messages buffered in memory
        by the gateway for the authenticated session, newest first. Intended
        for OTP retrieval and short-window inbox reads.

        The buffer keeps the last 100 incoming messages per session and is
        lost on gateway restart. Messages sent by the authenticated user are
        excluded. Media URLs are not populated by this endpoint — subscribe
        to webhooks if you need fetchable links.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Maximum number of messages to return. Clamped server-side to [1, 50].
      responses:
        '200':
          description: Messages returned successfully (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingMessagesResponse'
        '409':
          description: WhatsApp session is not logged in.
      security:
        - accountBearerAuth: []

webhooks:
  outgoingWebhook:
    post:
      summary: Outgoing WhatsApp Event Webhook
      description: >
        Webhook body when doing outgoing WhatsApp events such as message queued, sent, or failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutgoingWebhookPayload'
      responses:
        '200':
          description: Webhook received successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  incomingWebhook:
    post:
      summary: Incoming WhatsApp Event Webhook
      description: >
        Webhook body when receive incoming WhatsApp messages and events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingWebhookPayload'
      responses:
        '200':
          description: Webhook received successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true 

