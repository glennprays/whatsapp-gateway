openapi: 3.1.0
info:
  title: Whatsapp Gateway API
  version: 0.21.0
  description: >
    API documentation for Whatsapp Gateway.

    This service allows integration with WhatsApp through REST endpoints.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  x-docs-url: https://github.com/glennprays/whatsapp-gateway/wiki
  x-repository:
    type: git
    url: https://github.com/glennprays/whatsapp-gateway
servers:
  - url: /api/v1
tags:
  - name: Health
    description: Endpoints for checking the health of the service.
  - name: Authentication
    description: Endpoints for user authentication and registration.
  - name: Whatsapp Authentication
    description: Endpoints for WhatsApp authentication.
  - name: Whatsapp Webhook
    description: Endpoints for handling WhatsApp webhooks and events.
  - name: Whatsapp Message
    description: Endpoints for managing WhatsApp chats and messages.
  - name: Contact
    description: Endpoints for validating and listing contacts.
  - name: Group
    description: Endpoints for reading the account's WhatsApp groups.
  - name: Community
    description: Endpoints for reading a community's sub-groups and participants.
  - name: Admin
    description: >
      Operator-only, cross-tenant endpoints served at the ROOT path (not under
      /api/v1). Bearer-gated by ADMIN_API_SECRET; unregistered (404) when unset.
  - name: Metrics
    description: >
      Prometheus metrics at the ROOT path. Gated by METRICS_ENABLED and the admin
      bearer.

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional. Dedupes this send across retries. A repeated key replays the
        original response (with header `Idempotent-Replay: true`) instead of
        sending again; an in-flight duplicate returns `409`; the same key with a
        different request body returns `422`. Dedup is keyed by the JWT account +
        key and is DB-backed (survives restarts). In queue mode this guarantees
        enqueued-once, not delivered-once.
      schema:
        type: string
        example: "a1b2c3d4-order-4711"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A description of the error that occurred.
          example: "Invalid request syntax or parameters."
        code:
          type: integer
          description: An error code representing the type of error.
          example: 400
    RegisterRequest:
      type: object
      properties:
        phone_number:
          type: string
          description: The phone number of the user to authenticate.
          example: "6281234567890" 
        secret_key:
          type: string
          description: The secret key for authentication.
          example: "my_secret_key"
    RegisterResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token for the authenticated user.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    LoginQrResponse:
      type: object
      properties:
        qr_code:
          type: string
          description: Base64 encoded QR code for WhatsApp login.
          example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
        expires_in:
          type: integer
          description: Time in seconds until the QR code expires.
          example: 300
    LoginPairResponse:
      type: object
      properties:
        pair_code:
          type: string
          description: Pair code for WhatsApp login.
          example: "123456"
        expires_in:
          type: integer
          description: Time in seconds until the pair code expires.
          example: 300
    WebhookRegisterRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to register for receiving WhatsApp webhooks.
          example: "https://example.com/webhook"
        hmac_secret:
          type: string
          description: Optional secret for validating webhook requests.
          example: "my_webhook_secret"
    SendMessageTextRequest:
      type: object
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@us.c"
        message:
          type: string
          description: The text message to send.
          example: "Hello, this is a test message."
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention; include the matching @<number> token in `message` for it to render."
          example: ["6281111111111"]
    SendMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the message was sent successfully.
          example: true
        message_id:
          type: string
          description: The ID of the sent message.
          example: "msg_1234567890"
        chat:
          type: string
          description: The resolved canonical recipient JID.
          example: "6281234567890@s.whatsapp.net"
    SendMessageImageRequest:
      type: multipart/form-data
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@us.c"
        image:
          type: string
          format: binary
          description: The image file to send.
        caption:
          type: string
          description: Optional caption for the image.
          example: "Check out this image!"
        is_view_once:
          type: boolean
          description: Whether the image should be sent as view once.
          example: false
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. Send as repeated `mentions` form fields (not comma-joined). Include the matching @<number> token in `caption` for it to render."
          example: ["6281111111111"]
      required:
        - image
    SendMessageQueuedResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the message was queued successfully.
          example: true
        job_id:
          type: string
          description: The ID of the queued job.
          example: "job_1234567890"
        chat:
          type: string
          description: The resolved canonical recipient JID.
          example: "6281234567890@s.whatsapp.net"
    SendMessageLocationRequest:
      type: object
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@s.whatsapp.net"
        latitude:
          type: number
          description: Latitude of the location.
          example: -6.200000
        longitude:
          type: number
          description: Longitude of the location.
          example: 106.816666
        name:
          type: string
          description: Optional name of the location.
          example: "Jakarta"
        address:
          type: string
          description: Optional address of the location.
          example: "Jakarta, Indonesia"
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. The mention attaches (fires a notification) but a location has no text to render the @<number> inline."
          example: ["6281111111111"]
      required:
        - latitude
        - longitude
    SendMessagePollRequest:
      type: object
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@s.whatsapp.net"
        question:
          type: string
          description: The poll question.
          example: "What is your favorite color?"
        options:
          type: array
          items:
            type: string
          description: The poll options (minimum 2).
          minItems: 2
          example: ["Red", "Blue", "Green"]
        selectable_count:
          type: integer
          description: Number of options a user can select (default 1).
          default: 1
          example: 1
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. The mention attaches (fires a notification) but a poll has no free-text surface to render the @<number> inline."
          example: ["6281111111111"]
      required:
        - question
        - options
    SendMessageStickerRequest:
      type: multipart/form-data
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@s.whatsapp.net"
        sticker:
          type: string
          format: binary
          description: The sticker file to send.
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. Send as repeated `mentions` form fields (not comma-joined). The mention attaches (fires a notification) but a sticker has no caption to render the @<number> inline."
          example: ["6281111111111"]
      required:
        - sticker
    SendMessageAudioRequest:
      type: multipart/form-data
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@s.whatsapp.net"
        audio:
          type: string
          format: binary
          description: The audio file to send. For voice notes use opus/ogg.
        is_ptt:
          type: boolean
          description: >
            Render as a push-to-talk voice-note bubble (waveform). When true and
            no mimetype is sniffed, the gateway defaults to "audio/ogg; codecs=opus".
            Omit/leave false to send a playable audio-file card.
          example: true
        is_view_once:
          type: boolean
          description: Whether the audio should be sent as view once.
          example: false
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. Send as repeated `mentions` form fields (not comma-joined). The mention attaches (fires a notification) but audio has no caption to render the @<number> inline."
          example: ["6281111111111"]
      required:
        - audio
    SendMessageVideoRequest:
      type: multipart/form-data
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@s.whatsapp.net"
        video:
          type: string
          format: binary
          description: The video file to send (mp4/3gpp/webm).
        caption:
          type: string
          description: Optional caption for the video.
          example: "Check this out!"
        is_gif:
          type: boolean
          description: Toggle GIF-like rendering (GifPlayback).
          example: false
        is_view_once:
          type: boolean
          description: Whether the video should be sent as view once.
          example: false
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. Send as repeated `mentions` form fields (not comma-joined). Include the matching @<number> token in `caption` for it to render."
          example: ["6281111111111"]
      required:
        - video
    SendMessageDocumentRequest:
      type: multipart/form-data
      properties:
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@s.whatsapp.net"
        document:
          type: string
          format: binary
          description: The document/file to send (any mimetype).
        file_name:
          type: string
          description: >
            Visible file name. Defaults to the uploaded filename if omitted, then "file".
          example: "invoice.pdf"
        caption:
          type: string
          description: Optional caption. Wrapped so it renders reliably across clients.
          example: "Invoice for July"
        reply_to_id:
          type: string
          description: "Quote this message id (turns the send into a reply)."
          example: "3EB0C767D26A1D8A2C1B"
        reply_to_sender:
          type: string
          description: "Author of the quoted message (number/JID). Recommended with reply_to_id, required for group replies."
          example: "6289999999999@s.whatsapp.net"
        reply_to_text:
          type: string
          description: "Optional quoted preview text (storeless replies — the caller supplies what the quote shows)."
          example: "the original message"
        mentions:
          type: array
          items:
            type: string
          description: "Numbers/JIDs to @-mention. Send as repeated `mentions` form fields (not comma-joined). Include the matching @<number> token in `caption` for it to render."
          example: ["6281111111111"]
      required:
        - document
    ContactCheckResponse:
      type: object
      properties:
        query:
          type: string
          description: The phone number queried.
          example: "6281234567890"
        jid:
          type: string
          description: The canonical WhatsApp JID, or empty if not registered.
          example: "6281234567890@s.whatsapp.net"
        is_on_whatsapp:
          type: boolean
          description: Whether the number is registered on WhatsApp.
          example: true
        verified_name:
          type: string
          description: The business verified name, if the number is a verified business.
          example: "Acme Inc."
    ContactListItem:
      type: object
      properties:
        jid:
          type: string
          example: "6281234567890@s.whatsapp.net"
        push_name:
          type: string
          example: "Alice"
        full_name:
          type: string
          example: "Alice Tan"
        first_name:
          type: string
          example: "Alice"
        business_name:
          type: string
          example: "Acme Inc."
    ContactListResponse:
      type: object
      properties:
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactListItem'
        count:
          type: integer
          description: Items in this page.
          example: 100
        total:
          type: integer
          description: Total synced contacts.
          example: 240
        note:
          type: string
          description: Honest metadata about the synced-state of the store.
    GroupListItem:
      type: object
      properties:
        jid:
          type: string
          description: The group's @g.us JID.
          example: "120363000000000000@g.us"
        name:
          type: string
          example: "Project Team"
        topic:
          type: string
          example: "Release planning"
        owner_jid:
          type: string
          example: "6281234567890@s.whatsapp.net"
        participant_count:
          type: integer
          example: 12
        is_announce:
          type: boolean
          description: Only admins can send.
          example: false
        is_locked:
          type: boolean
          description: Only admins can edit group info.
          example: false
        is_community:
          type: boolean
          description: This group is a community parent.
          example: false
    GroupListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupListItem'
        count:
          type: integer
          example: 12
    GroupParticipantItem:
      type: object
      properties:
        jid:
          type: string
          example: "6281234567890@s.whatsapp.net"
        phone_number:
          type: string
          example: "6281234567890@s.whatsapp.net"
        lid:
          type: string
          example: "1122334455@lid"
        is_admin:
          type: boolean
          example: false
        is_super_admin:
          type: boolean
          example: false
    GroupInfoResponse:
      type: object
      properties:
        jid:
          type: string
          example: "120363000000000000@g.us"
        name:
          type: string
          example: "Project Team"
        topic:
          type: string
          example: "Release planning"
        owner_jid:
          type: string
          example: "6281234567890@s.whatsapp.net"
        participant_count:
          type: integer
          example: 12
        is_announce:
          type: boolean
          example: false
        is_locked:
          type: boolean
          example: false
        is_community:
          type: boolean
          example: false
        is_ephemeral:
          type: boolean
          example: false
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GroupParticipantItem'
    SubGroupItem:
      type: object
      properties:
        jid:
          type: string
          description: The sub-group's @g.us JID.
          example: "120363111111111111@g.us"
        name:
          type: string
          example: "Announcements"
        is_default_sub_group:
          type: boolean
          description: The community's default/announcement group.
          example: true
    SubGroupListResponse:
      type: object
      properties:
        sub_groups:
          type: array
          items:
            $ref: '#/components/schemas/SubGroupItem'
        count:
          type: integer
          example: 3
    CommunityParticipantItem:
      type: object
      properties:
        jid:
          type: string
          description: The participant's primary JID (@lid or @s.whatsapp.net).
          example: "1122334455@lid"
    CommunityParticipantsResponse:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CommunityParticipantItem'
        count:
          type: integer
          example: 42
    ContactInfoResponse:
      type: object
      properties:
        jid:
          type: string
          example: "6281234567890@s.whatsapp.net"
        status:
          type: string
          description: The user's "about" / status text.
          example: "Available"
        picture_id:
          type: string
          description: Current profile picture id (use with /contact/avatar for the image).
          example: "1234567890"
        verified_name:
          type: string
          example: "Acme Inc."
        device_count:
          type: integer
          description: Number of linked devices.
          example: 2
        lid:
          type: string
          example: "1122334455@lid"
    AvatarResponse:
      type: object
      properties:
        jid:
          type: string
          example: "6281234567890@s.whatsapp.net"
        url:
          type: string
          description: Time-limited WhatsApp CDN URL; download directly.
          example: "https://pps.whatsapp.net/v/t61.../avatar.jpg"
        id:
          type: string
          description: Picture id; also returned as the ETag.
          example: "1234567890"
        type:
          type: string
          description: "\"image\" (full res) or \"preview\" (thumbnail)."
          example: "image"
        direct_path:
          type: string
          example: "/v/t61.../avatar.jpg"
    MarkReadRequest:
      type: object
      properties:
        chat:
          type: string
          description: "Canonical chat (user or group JID, or bare number). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat."
          deprecated: true
          example: "6281234567890"
        message_ids:
          type: array
          items:
            type: string
          description: IDs of the messages to mark as read.
          example: ["3EB0C767D26A1D8A2C1B", "3EB0C767D26A1D8A2C1C"]
        sender:
          type: string
          description: The message author (required for group chats).
          example: "6289999999999@s.whatsapp.net"
      required:
        - message_ids
    ChatPresenceRequest:
      type: object
      properties:
        chat:
          type: string
          description: "Canonical chat (user or group JID, or bare number). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat."
          deprecated: true
          example: "6281234567890"
        state:
          type: string
          enum: [composing, recording, paused]
          description: "composing = typing…, recording = voice note, paused = cleared."
          example: "composing"
      required:
        - state
    MessageDeleteRequest:
      type: object
      properties:
        message_id:
          type: string
          description: The ID of the message to delete.
          example: "msg_1234567890"
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@us.c"
    MessageEditRequest:
      type: object
      properties:
        message_id:
          type: string
          description: The ID of the message to edit.
          example: "msg_1234567890"
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@us.c"
        new_message:
          type: string
          description: The new text for the message.
          example: "This is the edited message."
    MessageReactRequest:
      type: object
      properties:
        message_id:
          type: string
          description: The ID of the message to react to.
          example: "msg_1234567890"
        chat:
          type: string
          description: "Canonical recipient. Accepts a bare phone number, a user JID (@s.whatsapp.net), a group JID (@g.us), or a @lid. Preferred over msisdn (chat wins when both are set). Provide chat OR msisdn."
          example: "6281234567890@s.whatsapp.net"
        msisdn:
          type: string
          description: "Deprecated alias for chat (resolves to a user JID). Provide chat OR msisdn."
          deprecated: true
          example: "6281234567890@us.c"
        emoji:
          type: string
          description: The reaction to add (e.g., "👍", "❤️").
          example: "👍"
        sender_msisdn:
          type: string
          description: >
            Optional JID/phone of the original message's sender. Omit when
            reacting to your own outgoing message (FromMe=true). Required for
            correct attribution in groups and when reacting to incoming DM
            messages.
          example: "6281234567890@s.whatsapp.net"
    OutgoingEventMessage:
      type: string 
      enum:
        - message.queued 
        - message.sent 
        - message.failed 
    OutgoingWebhookPayload:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/OutgoingEventMessage'
        job_id:
          type: string
          description: The ID of the message job.
          example: "job_1234567890" 
        to:
          type: string
          description: The recipient's Personal ID or Group ID.
          example: "6281234567890@s.whatsapp.net"
        phone_number:
          type: string
          description: The sender's phone number.
          example: "6281234567890"
        timestamp:
          type: integer
          description: The timestamp of the event in Unix epoch format.
          example: 1625247600
        message_id:
          type: string
          description: The ID of the whatsapp message.
          example: "msg_1234567890" 
        metadata:
          type: object
          description: Additional metadata related to the event.
          example: {}
    IncomingEventMessage:
      type: string 
      enum:
        - message.incoming
    IncomingMessageType:
      type: string 
      enum:
        - text
        - image
        - video
        - audio
        - document
    IncomingMessageMediaInfo:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/IncomingMessageType'
        url:
          type: string
          description: The URL to access the media content. When WEBHOOK_MEDIA_DOWNLOAD_ENABLED=true, this is a presigned S3 URL (24h expiry) or public local URL. When false, this is the original WhatsApp URL.
          example: "https://example.com/media/msg_0987654321"
        mime_type:
          type: string
          description: The MIME type of the media content.
          example: "image/jpeg"
        filename:
          type: string
          description: The original filename of the media content.
          example: "photo.jpg"
        caption:
          type: string
          description: The caption associated with the media, if any.
          example: "Check out this photo!"
        size:
          type: integer
          description: The size of the media content in bytes.
          example: 204800

    IncomingWebhookPayload:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/IncomingEventMessage'
        chat:
          type: string
          description: The chat ID where the message was received.
          example: "6281234567890@s.whatsapp.net"
        from:
          type: string
          description: The sender's Personal ID or Group ID.
          example: "6281234567890:87@s.whatsapp.net"
        addressing_mode:
          type: string
          enum: [pn, lid]
          description: >
            How `from` is addressed. "pn" = a callable @s.whatsapp.net phone
            number. "lid" = the only available identifier was an opaque @lid
            (typically a group LID-only participant); do not assume `from` is
            dialable in that case.
          example: "pn"
        is_group:
          type: boolean
          description: Indicates if the message is from a group.
          example: false
        message_id:
          type: string
          description: The ID of the received message.
          example: "msg_0987654321"
        push_name:
          type: string
          description: The display name of the sender.
          example: "John Doe"
        timestamp:
          type: integer
          description: The timestamp of the message in Unix epoch format.
          example: 1625247600
        text:
          type: string
          description: The text content of the message.
          example: "Hello, this is a test message."
        type:
          $ref: '#/components/schemas/IncomingMessageType'
        media:
          $ref: '#/components/schemas/IncomingMessageMediaInfo'

    IncomingMessage:
      type: object
      description: A single buffered incoming message. Same vocabulary as IncomingWebhookPayload minus the event envelope. Media URLs are not populated here — see webhooks for fetchable links.
      properties:
        message_id:
          type: string
          example: "msg_0987654321"
        chat:
          type: string
          example: "6281234567890@s.whatsapp.net"
        from:
          type: string
          example: "6281234567890:87@s.whatsapp.net"
        is_group:
          type: boolean
          example: false
        push_name:
          type: string
          example: "Google"
        timestamp:
          type: integer
          example: 1625247600
        type:
          $ref: '#/components/schemas/IncomingMessageType'
        text:
          type: string
          example: "Your verification code is 123456"
        media:
          $ref: '#/components/schemas/IncomingMessageMediaInfo'

    IncomingMessagesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        timestamp:
          type: integer
          description: Unix milliseconds when the response was generated.
          example: 1715900000000
        count:
          type: integer
          example: 2
        messages:
          type: array
          items:
            $ref: '#/components/schemas/IncomingMessage'
    SessionInventoryItem:
      type: object
      description: Honest, per-instance view of one account (phone number masked).
      properties:
        phone_masked:
          type: string
          example: "62819104xxxx"
        state:
          type: string
          enum: [connected, disconnected, never_paired, logged_out, banned]
        source:
          type: string
          enum: [in-memory, store]
        reason:
          type: string
        last_seen:
          type: string
          format: date-time
        ban_expires_at:
          type: string
          format: date-time
          nullable: true
    SessionInventory:
      type: object
      properties:
        instance:
          type: string
          description: Reporting node hostname (the inventory is per-instance).
          example: gw-pod-7c9f
        count:
          type: integer
          example: 2
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInventoryItem'

  securitySchemes:
    accountBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearer:
      type: http
      scheme: bearer
      description: >
        Operator-only admin plane. Set ADMIN_API_SECRET and send
        `Authorization: Bearer <secret>`. When the secret is unset the entire
        plane is unregistered and returns 404 (never a 401 that would confirm it
        exists). Compared in constant time.

  responses:
    BadRequest:
      description: Invalid request syntax or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: A request with this Idempotency-Key is already in progress.
    IdempotencyBodyMismatch:
      description: The Idempotency-Key was reused with a different request body.
    Unauthorized:
      description: Authentication credentials missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user does not have permission to perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
       description: Conflict with the current state of the resource (e.g., email already exists).
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Returns the health status of the service.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new account
      description: >
        Registers a new user with the provided phone number and secret key to get JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '429':
          description: >
            Too many registration requests from this IP. Per-IP rate limited
            (REGISTER_RATE_LIMIT_REQUESTS per REGISTER_RATE_LIMIT_DURATION_SECONDS,
            5/min by default). Retry after the indicated window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "too many registration requests, please retry later"
              headers:
                Retry-After:
                  description: Seconds to wait before retrying.
                  schema:
                    type: integer
                    example: 42
  /login/qr_code/{format}:
    post:
      tags:
        - Whatsapp Authentication
      summary: Get WhatsApp login QR code
      description: >
        Generates a QR code for WhatsApp login. The QR code is valid for a limited time.
      parameters:
        - name: format
          in: path
          required: true
          description: The format of the QR code, either 'json' or 'html'.
          schema:
            type: string
            enum: [json, html]
      responses:
        '200':
          description: QR code generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginQrResponse'
            text/html:
              schema:
                type: string
                example: "<img src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...'/>"
      security:
        - accountBearerAuth: []
  /login/pair_code:
    post:
      tags:
        - Whatsapp Authentication
      summary: Get WhatsApp login pair code
      description: >
        Generates a pair code for WhatsApp login. The pair code is valid for a limited time.
      responses:
        '200':
          description: Pair code generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPairResponse'
      security:
        - accountBearerAuth: []
  /login/status:
    get:
      tags:
        - Whatsapp Authentication
      summary: Get WhatsApp session status
      description: >
        Retrieves the current WhatsApp session status, including whether the user is logged in.
      responses:
        '200':
          description: Session status retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    description: Indicates if the user is authenticated with WhatsApp.
                    example: true
      security:
        - accountBearerAuth: []
  /contact/check:
    get:
      tags:
        - Contact
      summary: Check if a number is on WhatsApp
      description: >
        Validates whether a recipient is registered on WhatsApp before sending
        (uses whatsmeow IsOnWhatsApp). Returns the canonical JID, registration
        status, and verified business name if any. Also warms the LID<->PN
        cache, reducing send fragility.
      parameters:
        - name: chat
          in: query
          required: false
          description: "Canonical recipient (see chat field). Provide chat OR msisdn."
          schema:
            type: string
            example: "6281234567890@s.whatsapp.net"
        - name: msisdn
          in: query
          required: false
          deprecated: true
          description: "Deprecated alias for chat. Provide chat OR msisdn (at least one is required)."
          schema:
            type: string
            example: "6281234567890"
      responses:
        '200':
          description: Recipient validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCheckResponse'
      security:
        - accountBearerAuth: []
  /contact/:
    get:
      tags:
        - Contact
      summary: List synced contacts
      description: >
        Lists the account's locally-synced contacts (whatsmeow address book).
        A pure local-store read — no network call and no read budget spent. The
        store fills in after pairing and as the account is used, so an empty or
        partial result is normal, not an error (never 404). Paginated over a
        stable JID sort.
      parameters:
        - name: limit
          in: query
          required: false
          description: "Page size (default 100, max 500)."
          schema:
            type: integer
            example: 100
        - name: offset
          in: query
          required: false
          description: "Number of contacts to skip (default 0)."
          schema:
            type: integer
            example: 0
      responses:
        '200':
          description: A page of synced contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
      security:
        - accountBearerAuth: []
  /group/:
    get:
      tags:
        - Group
      summary: List joined groups
      description: >
        Lists the account's joined groups as lightweight summaries (no
        participant roster). This hits the WhatsApp server (GetJoinedGroups), so
        it is short-TTL cached and metered by a per-account read budget: repeat
        polls are served from cache, and an exhausted budget returns 429. The
        full set is returned in one call (not paginated).
      responses:
        '200':
          description: The account's joined groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '429':
          description: Per-account read budget exhausted; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /group/info:
    get:
      tags:
        - Group
      summary: Get one group's full detail
      description: >
        Returns a single group's full detail including its participant roster
        (whatsmeow GetGroupInfo, a server IQ). Requires a group JID and that the
        account is a participant. Cached + metered by the per-account read
        budget.
      parameters:
        - name: chat
          in: query
          required: true
          description: "The target group's JID (must be @g.us)."
          schema:
            type: string
            example: "120363000000000000@g.us"
      responses:
        '200':
          description: The group's detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInfoResponse'
        '400':
          description: chat is missing or is not a group JID.
        '403':
          description: The account is not a participant of that group.
        '404':
          description: The group does not exist.
        '429':
          description: Per-account read budget exhausted; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /community/subgroups:
    get:
      tags:
        - Community
      summary: List a community's sub-groups
      description: >
        Lists the groups linked under a community (whatsmeow GetSubGroups, a
        server IQ). chat must be the community's @g.us JID. Short-TTL cached and
        metered by the per-account read budget (429 when exhausted). A community
        with zero sub-groups returns an empty list, not an error; a chat that is
        a group but not a community returns 400/404.
      parameters:
        - name: chat
          in: query
          required: true
          description: "The community's JID (must be @g.us)."
          schema:
            type: string
            example: "120363000000000000@g.us"
      responses:
        '200':
          description: The community's sub-groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubGroupListResponse'
        '400':
          description: chat is missing, is not a group JID, or is not a community.
        '403':
          description: The account is not authorized to read that community.
        '404':
          description: The community does not exist.
        '429':
          description: Per-account read budget exhausted; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /community/participants:
    get:
      tags:
        - Community
      summary: List all community participants
      description: >
        Lists every participant across a community's linked groups (whatsmeow
        GetLinkedGroupsParticipants, a server IQ). Returns each participant's
        primary JID (@lid or @s.whatsapp.net). chat must be the community's
        @g.us JID. Cached + metered by the per-account read budget like other
        server reads.
      parameters:
        - name: chat
          in: query
          required: true
          description: "The community's JID (must be @g.us)."
          schema:
            type: string
            example: "120363000000000000@g.us"
      responses:
        '200':
          description: The community's participants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityParticipantsResponse'
        '400':
          description: chat is missing, is not a group JID, or is not a community.
        '403':
          description: The account is not authorized to read that community.
        '404':
          description: The community does not exist.
        '429':
          description: Per-account read budget exhausted; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /contact/info:
    get:
      tags:
        - Contact
      summary: Get a user's profile info
      description: >
        Returns a server-side profile lookup for one user (whatsmeow
        GetUserInfo): status text, current picture id, verified business name,
        and linked-device count. Cached + metered by the per-account read
        budget. An unknown number yields a response with the JID only.
      parameters:
        - name: chat
          in: query
          required: false
          description: "Canonical recipient (a user JID or bare number). Provide chat OR msisdn."
          schema:
            type: string
            example: "6281234567890@s.whatsapp.net"
        - name: msisdn
          in: query
          required: false
          deprecated: true
          description: "Deprecated alias for chat. Provide chat OR msisdn."
          schema:
            type: string
            example: "6281234567890"
      responses:
        '200':
          description: The user's profile info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInfoResponse'
        '400':
          description: chat is missing or resolves to a group (use group/info).
        '429':
          description: Per-account read budget exhausted; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /contact/avatar:
    get:
      tags:
        - Contact
      summary: Get a chat's avatar (profile picture)
      description: >
        Returns a chat's profile picture (whatsmeow GetProfilePictureInfo). The
        `chat` may be a user OR a group JID. Returns a time-limited CDN URL plus
        the picture id; download the URL directly. The id doubles as the `ETag`
        — send it back via `If-None-Match` on the next call to get `304 Not
        Modified` when the picture hasn't changed. Cached + metered by the
        per-account read budget (the `If-None-Match` freshness check bypasses the
        cache but still spends budget).
      parameters:
        - name: chat
          in: query
          required: false
          description: "Canonical chat (user or group JID, or bare number). Provide chat OR msisdn."
          schema:
            type: string
            example: "6281234567890@s.whatsapp.net"
        - name: msisdn
          in: query
          required: false
          deprecated: true
          description: "Deprecated alias for chat."
          schema:
            type: string
            example: "6281234567890"
        - name: preview
          in: query
          required: false
          description: "true returns the low-res thumbnail; false (default) the full-res image."
          schema:
            type: boolean
            example: false
        - name: If-None-Match
          in: header
          required: false
          description: "A previously returned avatar ETag. When it still matches, the response is 304."
          schema:
            type: string
      responses:
        '200':
          description: The chat's avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '304':
          description: The avatar is unchanged relative to the supplied If-None-Match.
        '403':
          description: The target has hidden their profile picture from you.
        '404':
          description: The target has no profile picture set.
        '429':
          description: Per-account read budget exhausted; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /message/read:
    post:
      tags:
        - Whatsapp Message
      summary: Mark messages as read
      description: >
        Marks one or more messages in a chat as read (blue ticks). For a group
        chat, `sender` (the message author's number/JID) is required so the
        receipt is attributed. Counts against the interim per-account action cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '200':
          description: Messages marked as read.
        '400':
          description: Missing message_ids, or a group chat without sender.
        '429':
          description: Action rate limit exceeded; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /chat/presence:
    post:
      tags:
        - Whatsapp Message
      summary: Set the typing indicator
      description: >
        Sets the chat presence (typing indicator). `state` is `composing`
        (typing…), `recording` (recording a voice note; sent as composing +
        audio), or `paused`. The indicator auto-expires client-side after a few
        seconds, so an explicit `paused` is optional. Counts against the interim
        per-account action cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatPresenceRequest'
      responses:
        '200':
          description: Presence sent.
        '400':
          description: Invalid or missing state.
        '429':
          description: Action rate limit exceeded; retry after the indicated delay.
      security:
        - accountBearerAuth: []
  /session/reconnect:
    post:
      tags:
        - Whatsapp Authentication
      summary: Reconnect to WhatsApp session
      description: >
        Attempts to reconnect to the existing WhatsApp session.
      responses:
        '200':
          description: Reconnection attempt initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /logout:
    post:
      tags:
        - Whatsapp Authentication
      summary: Logout from WhatsApp session
      description: >
        Logs out the user from the current WhatsApp session.
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
      security:
        - accountBearerAuth: []
  /webhook:
    get:
      tags:
        - Whatsapp Webhook
      summary: Get registered webhook URL
      description: >
        Retrieves the currently registered webhook URL for receiving WhatsApp events.
      responses:
        '200':
          description: Webhook URL retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: The registered webhook URL.
                    example: "https://example.com/webhook"
      security:
        - accountBearerAuth: []
    post:
      tags:
        - Whatsapp Webhook
      summary: Register a webhook URL
      description: >
        Registers a URL to receive WhatsApp webhook events. Optionally, a secret can be provided for validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRegisterRequest'
      responses:
        '200':
          description: Webhook URL registered successfully.
          content:
