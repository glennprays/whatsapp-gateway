openapi: 3.1.0
info:
  title: Whatsapp Gateway API
  version: 1.0.0
  description: >
    API documentation for Whatsapp Gateway.

    This service allows integration with WhatsApp through REST endpoints.
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  x-docs-url: https://github.com/glennprays/whatsapp-gateway/wiki
  x-repository:
    type: git
    url: https://github.com/glennprays/whatsapp-gateway
servers:
  - url: /api/v1
tags:
  - name: Health
    description: Endpoints for checking the health of the service.
  - name: Authentication
    description: Endpoints for user authentication and registration.

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A description of the error that occurred.
          example: "Invalid request syntax or parameters."
        code:
          type: integer
          description: An error code representing the type of error.
          example: 400
    RegisterRequest:
      type: object
      properties:
        phone_number:
          type: string
          description: The phone number of the user to authenticate.
          example: "6281234567890" 
        secret_key:
          type: string
          description: The secret key for authentication.
          example: "my_secret_key"
    RegisterResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token for the authenticated user.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    
  securitySchemes:
    accountBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses: 
    BadRequest:
      description: Invalid request syntax or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication credentials missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user does not have permission to perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
       description: Conflict with the current state of the resource (e.g., email already exists).
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      description: Returns the health status of the service.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new account
      description: >
        Registers a new user with the provided phone number and secret key to get JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
