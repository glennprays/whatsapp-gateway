name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/ui/**'
      - '.github/workflows/docs-pages.yml'
      - 'scripts/build-docs-pages.sh'
      - 'llms.txt'
      - 'docs/openapi.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for actual changes
        id: check
        run: |
          # Get list of changed files in relevant paths
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- \
            'docs/ui/**' \
            '.github/workflows/docs-pages.yml' \
            'scripts/build-docs-pages.sh' \
            'llms.txt' \
            'docs/openapi.yaml' \
            2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes in documentation files"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build docs
        run: |
          chmod +x scripts/build-docs-pages.sh
          ./scripts/build-docs-pages.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
