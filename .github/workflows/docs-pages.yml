name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/ui/**'
      - '.github/workflows/docs-pages.yml'
      - 'scripts/build-docs-pages.sh'
      - 'cmd/docs-gen/**'
      - 'pkg/docsgen/**'
      - 'go.mod'
      - 'go.sum'
      - 'llms.txt'
      - 'docs/openapi.yaml'
  workflow_dispatch:
  # Redeploy once "Release (Create Tag)" finishes so the version badge picks up
  # the freshly-created tag (the push-triggered build above races tag creation
  # and would only see the previous tag).
  workflow_run:
    workflows: ["Release (Create Tag)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-changes:
    # For release-tag redeploys, only proceed when the release actually
    # succeeded on main; other events always evaluate the diff below.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for actual changes
        id: check
        run: |
          # Manual dispatch and post-release redeploys always rebuild, regardless
          # of diff (the release redeploy exists purely to refresh the tag badge).
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            echo "Forced trigger (${GITHUB_EVENT_NAME}): forcing build + deploy"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get list of changed files in relevant paths
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- \
            'docs/ui/**' \
            '.github/workflows/docs-pages.yml' \
            'scripts/build-docs-pages.sh' \
            'cmd/docs-gen/**' \
            'pkg/docsgen/**' \
            'go.mod' \
            'go.sum' \
            'llms.txt' \
            'docs/openapi.yaml' \
            2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes in documentation files"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so build-docs-pages.sh's `git describe --tags`
          # resolves the version badge to a real tag instead of a bare commit SHA.
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build docs
        run: |
          chmod +x scripts/build-docs-pages.sh
          ./scripts/build-docs-pages.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
