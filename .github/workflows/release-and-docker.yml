name: Release and Docker Multi-Arch Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # =========================
  # JOB 1: CREATE TAG FROM PR
  # =========================
  tag-from-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get merged PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            if (prs.data.length === 0) {
              core.info("No PR associated with commit. Skipping release.");
              return null;
            }

            return prs.data[0];

      - name: Exit if no PR
        if: steps.pr.outputs.result == ''
        run: exit 0

      - name: Determine release type from labels
        id: release
        run: |
          LABELS="${{ join(fromJson(steps.pr.outputs.result).labels.*.name, ' ') }}"

          COUNT=0
          for t in major minor patch; do
            if echo "$LABELS" | grep -q "release:$t"; then
              TYPE=$t
              COUNT=$((COUNT+1))
            fi
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "No release label found. Skipping."
            exit 0
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "Multiple release labels found."
            exit 1
          fi

          echo "TYPE=$TYPE" >> $GITHUB_OUTPUT

      - name: Fetch tags
        run: git fetch --tags

      - name: Check if first release
        id: first
        run: |
          COUNT=$(git tag -l 'v*' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "FIRST=true" >> $GITHUB_OUTPUT
          else
            echo "FIRST=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest tag
        id: latest
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          echo "TAG=${TAG:-v0.0.0}" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: version
        run: |
          if [ "${{ steps.first.outputs.FIRST }}" = "true" ]; then
            echo "VERSION=v0.0.1" >> $GITHUB_OUTPUT
            exit 0
          fi

          RAW_TAG="${{ steps.latest.outputs.TAG }}"
          CLEAN_TAG="${RAW_TAG#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"

          case "${{ steps.release.outputs.TYPE }}" in
            major)
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR+1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH+1)) ;;
          esac

          echo "VERSION=v$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.version.outputs.VERSION }}" \
            -m "Release ${{ steps.version.outputs.VERSION }}"
          git push origin "${{ steps.version.outputs.VERSION }}"

  # =========================
  # JOB 2: DOCKER BUILD (TAG ONLY)
  # =========================
  docker:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          git branch --contains $GITHUB_SHA | grep "main" \
            || (echo "Tag is not on main branch" && exit 1)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE }}:${{ steps.tag.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE }}:latest
